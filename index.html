<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR光の柱 修正サンプル</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
    /* 100vh は iOS Safari でアドレスバー分ずれるため、fixed + inset:0 の1つの箱に映像とCGを重ねる */
    #stage { position: fixed; inset: 0; }
    #camera-video, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #camera-video { object-fit: cover; }
    #gl { pointer-events: none; }

    #ui {
      position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.6); padding: 10px 20px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,.2); text-align: center; pointer-events: none; z-index: 10; white-space: nowrap;
    }
    #ui h1 { font-size: 15px; margin: 0 0 2px; color: #00ffff; }
    #ui p { font-size: 12px; margin: 0; color: #ccc; }

    #bottom {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px; z-index: 20; pointer-events: none;
    }
    #panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: auto; }
    #panel button {
      padding: 10px 14px; font-size: 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.3);
      background: rgba(0,0,0,.6); color: #fff;
    }
    #panel button.on { border-color: #00ffff; color: #00ffff; }
    #panel label { font-size: 12px; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 20px; display: flex; gap: 6px; align-items: center; }
    #panel input[type=range] { width: 110px; }
    #debug {
      background: rgba(0,0,0,.75); padding: 8px 10px; border-radius: 8px;
      font: 12px/1.45 monospace; color: #0f0; white-space: pre; max-width: 100%; overflow: hidden;
    }
    /* 山マスクの解析画像（稜線表示の時だけ） */
    #skyline-debug {
      position: fixed; right: 12px; top: calc(84px + env(safe-area-inset-top)); z-index: 20;
      width: 30vw; max-width: 180px; image-rendering: pixelated; pointer-events: none;
      border: 1px solid rgba(255,255,255,.5); border-radius: 4px;
    }
    #start-btn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 16px 32px; font-size: 18px; font-weight: bold;
      background: linear-gradient(135deg, #00ffff, #0088ff); color: #000;
      border: none; border-radius: 50px; box-shadow: 0 0 20px rgba(0,255,255,.5); cursor: pointer; z-index: 100;
    }
    .hidden { display: none !important; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="skyline-mask.js"></script>
</head>
<body>
  <div id="stage">
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="gl"></canvas>
  </div>

  <div id="ui">
    <h1>AR実景合成（修正版）</h1>
    <p>開始時に向いていた方向が「正面」になります</p>
  </div>

  <div id="bottom">
    <div id="debug">ボタンを押してください</div>
    <div id="panel" class="hidden">
      <button id="recenter-btn">ここを正面にする</button>
      <button id="mask-btn" class="on">山マスク ON</button>
      <button id="line-btn">稜線表示</button>
      <button id="clear-btn" class="hidden">稜線を消去</button>
      <label>画角 <input id="fov" type="range" min="45" max="90" step="1"> <span id="fov-val"></span>°</label>
      <button id="debug-btn">情報</button>
    </div>
  </div>
  <canvas id="skyline-debug" class="hidden"></canvas>

  <button id="start-btn">タップして開始</button>

  <script>
  'use strict';
  const rad = THREE.MathUtils.degToRad;
  const deg = THREE.MathUtils.radToDeg;

  // ---------------------------------------------------------------
  // 設定
  // ---------------------------------------------------------------
  // カメラ映像の「長辺方向」の画角（度）。iPhone標準(1x)カメラで約65°前後。
  // 実景とCGが回転時にずれる（CGが滑る）場合はスライダーで合わせる。
  const settings = { fovLong: 65 };
  try { const v = parseFloat(localStorage.getItem('ar-fovLong')); if (v) settings.fovLong = v; } catch (e) {}
  // 回転のなめらかさ（時定数・秒）。大きいほど遅れる＝映像に対してCGが遅れて「泳ぐ」。
  const SMOOTH_TAU = 0.04;

  // ---------------------------------------------------------------
  // 状態
  // ---------------------------------------------------------------
  const stage = document.getElementById('stage');
  const video = document.getElementById('camera-video');
  const debugElem = document.getElementById('debug');
  let scene, camera, renderer, clock;
  let skyline = null;            // 山マスク（skyline-mask.js）
  const view = { w: 0, h: 0 };   // 表示領域の大きさ（CSS px）
  const pillars = [];

  const deviceQ = new THREE.Quaternion();   // 端末の姿勢（センサーの α,β,γ から作る）
  const yawOffset = new THREE.Quaternion(); // 「正面」合わせのための水平回転
  const targetQ = new THREE.Quaternion();
  let hasSensor = false;     // 有効なセンサー値を1回でも受け取ったか
  let needRecenter = true;   // 最初の有効値で自動的に正面合わせ
  let firstFrame = true;
  const raw = { a: null, b: null, g: null, heading: null };

  // ---------------------------------------------------------------
  // 端末姿勢 → three.js カメラの向き
  //   W3C DeviceOrientation の α,β,γ は Z-X'-Y'' 順のオイラー角。
  //   3つは「同じ瞬間の同じ回転」を表す1組なので、1つだけ別の値（コンパス等）に
  //   差し替えてはいけない（β≒90°の“立てた持ち方”付近で破綻する）。
  // ---------------------------------------------------------------
  const zee = new THREE.Vector3(0, 0, 1);
  const euler = new THREE.Euler();
  const qTmp = new THREE.Quaternion();
  const qCamFix = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // 端末の背面(−Z)をカメラ前方へ: X軸 −90°

  // 端末本体（縦持ちが基準）の姿勢。画面回転の補正はまだ含まない。
  function setDeviceQuaternion(out, alpha, beta, gamma) {
    euler.set(beta, alpha, -gamma, 'YXZ');            // three.js の Y-up 座標系へ並べ替え
    out.setFromEuler(euler);
    out.multiply(qCamFix);
    return out;
  }

  // ---------------------------------------------------------------
  // 画面の回転角（横持ち補正）
  //   これを誤ると画面上で上下と左右が入れ替わる（90°ずれ）か、上下左右が逆になる（180°ずれ）。
  //   Apple 端末では API が当てにならない：
  //     ・iPad の Safari は既定で「Mac として」振る舞い、window.orientation が無い
  //     ・window.orientation と screen.orientation.angle で符号が逆になる報告がある
  //   そこで Apple 端末では「表示が縦長か横長か」と「重力が端末のどちら側に向いているか」から求める。
  // ---------------------------------------------------------------
  const IS_IPAD = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IS_APPLE_MOBILE = IS_IPAD || /iPhone|iPod/.test(navigator.userAgent);
  let screenAngleDeg = 0;
  const _g = new THREE.Vector3();
  const _qInv = new THREE.Quaternion();

  function updateScreenAngle(qDevice) {
    if (!IS_APPLE_MOBILE) {
      if (screen.orientation && typeof screen.orientation.angle === 'number') screenAngleDeg = screen.orientation.angle;
      else if (typeof window.orientation === 'number') screenAngleDeg = window.orientation;
      else screenAngleDeg = 0;
      return screenAngleDeg;
    }
    // 重力（下向き）を端末座標へ： x=端末の右, y=端末の上（縦持ち基準）
    _g.set(0, -1, 0).applyQuaternion(_qInv.copy(qDevice).invert());
    const landscape = window.innerWidth > window.innerHeight;
    if (landscape) {
      // 左側面が下 → 反時計回りに倒した横持ち = +90°、右側面が下 = −90°
      if (Math.abs(_g.x) > 0.2) screenAngleDeg = _g.x < 0 ? 90 : -90;
      else if (screenAngleDeg % 180 === 0) screenAngleDeg = 90; // 平置き等で判断できない時
    } else {
      // 縦長表示。逆さ縦持ちで画面が回るのは iPad のみ
      if (IS_IPAD && Math.abs(_g.y) > 0.2) screenAngleDeg = _g.y > 0 ? 180 : 0;
      else if (!IS_IPAD || screenAngleDeg % 180 !== 0) screenAngleDeg = 0;
    }
    return screenAngleDeg;
  }

  function handleOrientation(e) {
    // null（未キャリブレーション・PC等）は 0 扱いせず捨てる。0 にすると一瞬“北”を向いて跳ぶ。
    if (e.alpha == null || e.beta == null || e.gamma == null) return;
    raw.a = e.alpha; raw.b = e.beta; raw.g = e.gamma;
    // iOS のコンパス値は「表示用」にだけ使う。α に代入しない（回転方向が逆＆βγと不整合）。
    raw.heading = (typeof e.webkitCompassHeading === 'number') ? e.webkitCompassHeading : null;

    setDeviceQuaternion(deviceQ, rad(e.alpha), rad(e.beta), rad(e.gamma));
    const angle = updateScreenAngle(deviceQ);
    deviceQ.multiply(qTmp.setFromAxisAngle(zee, -rad(angle))); // 画面の回転（横持ち）を補正
    hasSensor = true;
    if (needRecenter) { recenter(); needRecenter = false; }
  }

  // 今カメラが向いている水平方向を「正面（−Z）」にする
  const _v = new THREE.Vector3();
  function recenter() {
    _v.set(0, 0, -1).applyQuaternion(deviceQ);              // カメラ前方
    if (Math.hypot(_v.x, _v.z) < 0.3) {                     // 真下/真上を向いている時は端末の上方向で代用
      _v.set(0, 1, 0).applyQuaternion(deviceQ);
    }
    const yaw = Math.atan2(-_v.x, -_v.z);
    yawOffset.setFromAxisAngle(THREE.Object3D.DefaultUp, -yaw);
    firstFrame = true;
  }

  // ---------------------------------------------------------------
  // 起動
  // ---------------------------------------------------------------
  document.getElementById('start-btn').addEventListener('click', startAR);

  function startAR() {
    document.getElementById('start-btn').classList.add('hidden');
    // iOS: requestPermission はタップ処理の中で“同期的に”呼ぶ必要がある
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(res => {
          if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
          else debugElem.textContent = 'センサー許可が拒否されました（ドラッグで見回せます）';
        })
        .catch(err => { debugElem.textContent = 'ERROR: ' + err; });
    } else {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
    initThree();
    initCamera();
    enableDragFallback();
    document.getElementById('panel').classList.remove('hidden');
  }

  async function initCamera() {
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
      });
    } catch (err) {
      debugElem.textContent = 'カメラを利用できません: ' + err.name;
    }
  }

  function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
    camera.position.set(0, 1.6, 0); // 目の高さ
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    clock = new THREE.Clock();

    // 開始時の正面 = −Z、右 = +X、左 = −X
    [
      { x: 0,    z: -60, radius: 2.0, height: 150, color: 0x00ffff }, // 正面
      { x: 150,  z: 0,   radius: 4.0, height: 300, color: 0x33ffff }, // 右
      { x: -150, z: 0,   radius: 4.0, height: 300, color: 0x00e5ff }  // 左
    ].forEach(c => createPillar(c.x, c.z, c.radius, c.height, c.color));

    // 山マスク：カメラ映像の稜線より下では柱を隠す（詳しくは skyline-mask.js）
    skyline = new SkylineMask({ video, debugCanvas: document.getElementById('skyline-debug') });
    scene.add(skyline.group);

    updateProjection();
    window.addEventListener('resize', updateProjection);
    window.addEventListener('orientationchange', () => setTimeout(updateProjection, 300));
    video.addEventListener('loadedmetadata', updateProjection);
    video.addEventListener('resize', updateProjection); // 端末回転で映像の縦横が変わる
    renderer.setAnimationLoop(animate);
  }

  function createPillar(x, z, radius, height, colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32, 1, true), mat);
    cyl.position.y = height / 2;
    group.add(cyl);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
    const core = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, height, 16, 1, true), coreMat);
    core.position.y = height / 2;
    group.add(core);
    group.position.set(x, 0, z);
    scene.add(group);
    pillars.push(group);
  }

  // ---------------------------------------------------------------
  // 画角を「実際に画面に映っているカメラ映像」に合わせる
  //   object-fit: cover は映像を拡大して端を切り落とすので、
  //   画面に見えている範囲の角度を焦点距離(px)から計算する。
  // ---------------------------------------------------------------
  function updateProjection() {
    if (!renderer) return;
    const W = stage.clientWidth, H = stage.clientHeight;
    view.w = W; view.h = H;
    renderer.setSize(W, H, false);
    camera.aspect = W / H;

    let vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { vw = W > H ? 4 : 3; vh = W > H ? 3 : 4; } // 映像未取得時は 4:3 と仮定
    const f = (Math.max(vw, vh) / 2) / Math.tan(rad(settings.fovLong) / 2); // 焦点距離（映像px）
    const scale = Math.max(W / vw, H / vh);                                 // cover の拡大率
    const visibleH = H / scale;                                             // 画面に見えている映像の高さ（映像px）
    camera.fov = deg(2 * Math.atan((visibleH / 2) / f));                    // three.js の fov は縦方向
    camera.updateProjectionMatrix();
  }

  const fovInput = document.getElementById('fov');
  const fovVal = document.getElementById('fov-val');
  fovInput.value = settings.fovLong; fovVal.textContent = settings.fovLong;
  fovInput.addEventListener('input', () => {
    settings.fovLong = parseFloat(fovInput.value);
    fovVal.textContent = settings.fovLong;
    try { localStorage.setItem('ar-fovLong', settings.fovLong); } catch (e) {}
    updateProjection();
  });
  document.getElementById('recenter-btn').addEventListener('click', () => { if (hasSensor) recenter(); else drag.yaw = 0; });
  let showDebug = true;
  document.getElementById('debug-btn').addEventListener('click', () => { showDebug = !showDebug; debugElem.classList.toggle('hidden', !showDebug); });

  const maskBtn = document.getElementById('mask-btn');
  maskBtn.addEventListener('click', () => {
    skyline.enabled = !skyline.enabled;
    maskBtn.textContent = '山マスク ' + (skyline.enabled ? 'ON' : 'OFF');
    maskBtn.classList.toggle('on', skyline.enabled);
  });
  const lineBtn = document.getElementById('line-btn');
  const clearBtn = document.getElementById('clear-btn');
  lineBtn.addEventListener('click', () => {
    skyline.showLine = !skyline.showLine;
    lineBtn.classList.toggle('on', skyline.showLine);
    clearBtn.classList.toggle('hidden', !skyline.showLine);
  });
  clearBtn.addEventListener('click', () => skyline.reset());

  // ---------------------------------------------------------------
  // PC 等センサーが無い環境ではドラッグで見回せるようにする（動作確認用）
  // ---------------------------------------------------------------
  const drag = { yaw: 0, pitch: 0, active: false, x: 0, y: 0 };
  function enableDragFallback() {
    stage.addEventListener('pointerdown', e => { drag.active = true; drag.x = e.clientX; drag.y = e.clientY; });
    window.addEventListener('pointerup', () => { drag.active = false; });
    window.addEventListener('pointermove', e => {
      if (!drag.active || hasSensor) return;
      drag.yaw += (e.clientX - drag.x) * 0.004;
      drag.pitch = THREE.MathUtils.clamp(drag.pitch + (e.clientY - drag.y) * 0.004, -1.5, 1.5);
      drag.x = e.clientX; drag.y = e.clientY;
    });
  }

  // ---------------------------------------------------------------
  // 描画ループ
  // ---------------------------------------------------------------
  function animate() {
    const dt = Math.min(clock.getDelta(), 0.1);

    if (hasSensor) {
      targetQ.copy(yawOffset).multiply(deviceQ);   // 世界 ← 正面合わせ ← 端末姿勢
    } else {
      targetQ.setFromEuler(euler.set(drag.pitch, drag.yaw, 0, 'YXZ'));
    }

    // フレームレートに依存しない平滑化（毎フレーム0.15固定だと60fpsと30fpsで遅れ方が変わる）
    if (firstFrame) { camera.quaternion.copy(targetQ); firstFrame = false; }
    else camera.quaternion.slerp(targetQ, 1 - Math.exp(-dt / SMOOTH_TAU));

    // 山マスク：向きセンサーがある時だけ（向きが分からないと、稜線を方位に直せない）
    if (hasSensor) skyline.update(dt, deviceQ, yawOffset, camera, view.w, view.h);

    pillars.forEach(p => { p.rotation.y += 0.3 * dt; });
    renderer.render(scene, camera);

    if (showDebug) {
      _v.set(0, 0, -1).applyQuaternion(camera.quaternion);
      const yaw = deg(Math.atan2(-_v.x, -_v.z));            // 正面=0、右=+（時計回り）
      const pitch = deg(Math.asin(THREE.MathUtils.clamp(_v.y, -1, 1)));
      const fmt = v => (v == null ? '---' : v.toFixed(1).padStart(6));
      debugElem.textContent =
        (hasSensor ? 'センサー: 動作中' : 'センサー: なし（ドラッグで操作）') + '\n' +
        `α ${fmt(raw.a)}  β ${fmt(raw.b)}  γ ${fmt(raw.g)}\n` +
        `方位(正面基準) ${fmt(-yaw)}°  仰角 ${fmt(pitch)}°\n` +
        `コンパス ${fmt(raw.heading)}°  画面回転 ${screenAngleDeg}°${IS_APPLE_MOBILE ? '(重力推定)' : ''}\n` +
        `映像 ${video.videoWidth}x${video.videoHeight}  縦画角 ${camera.fov.toFixed(1)}°\n` +
        `山マスク ${skyline.enabled ? 'ON' : 'OFF'}: ${skyline.stats.state}  検出 ${skyline.stats.valid}/${skyline.stats.columns}列  学習 ${skyline.learnedPercent()}%`;
    }
  }
  </script>
</body>
</html>
